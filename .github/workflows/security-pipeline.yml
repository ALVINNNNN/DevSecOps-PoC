# .github/workflows/security-pipeline.yml
#
# DevSecOps PoC - end-to-end security scanning: SAST + SCA + DAST.
# Runs on GitHub's FREE cloud Linux runners (ubuntu-latest) so there is no
# runner/Docker/WSL setup to fight with. Findings go to the Security tab (SARIF).
#
# (To move this onto your own machine later, register a Linux self-hosted
#  runner inside WSL2 and change `ubuntu-latest` to `[self-hosted]`.)

name: Security Pipeline (SAST + SCA + DAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: read
  security-events: write    # required to publish SARIF to the Security tab
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST - scans your source code (Semgrep installed directly, no container)
  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        # `|| true` = report findings but don't fail the PoC build.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif || true

      - name: Upload Semgrep results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 2. SCA - scans your dependencies (Trivy installed via official script)
  # ---------------------------------------------------------------------------
  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --format sarif --output trivy.sarif \
            --severity CRITICAL,HIGH,MEDIUM . || true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # 3. DAST - attacks the RUNNING app (Juice Shop) with OWASP ZAP
  # ---------------------------------------------------------------------------
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start target app (OWASP Juice Shop)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for the app to boot..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000 > /dev/null; then echo "App is up."; break; fi
            sleep 3
          done

      - name: OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -I -r zap-report.html || true

      - name: Upload ZAP report (download from run Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-report.html

      - name: Stop target app
        if: always()
        run: docker rm -f juice-shop || true
