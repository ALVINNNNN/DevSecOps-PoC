# .github/workflows/security-pipeline.yml
#
# DevSecOps PoC - end-to-end security scanning: SAST + SCA + DAST.
# Runs on GitHub's FREE cloud Linux runners (ubuntu-latest). Findings go to the
# Security tab (SARIF); the DAST report is uploaded as a downloadable artifact.

name: Security Pipeline (SAST + SCA + DAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: read
  security-events: write    # required to publish SARIF to the Security tab
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST - scans your source code
  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif || true

      - name: Upload Semgrep results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 2. SCA - scans your dependencies
  # ---------------------------------------------------------------------------
  sca-trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --format sarif --output trivy.sarif \
            --severity CRITICAL,HIGH,MEDIUM . || true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # 3. DAST - attacks the RUNNING app (Juice Shop) with OWASP ZAP
  # ---------------------------------------------------------------------------
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start target app (OWASP Juice Shop)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for the app to boot..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000 > /dev/null; then echo "App is up."; break; fi
            sleep 3
          done

      # Register a test account (fresh container has none) and log in to get a
      # JWT. If anything fails we fall back to an unauthenticated scan.
      - name: Authenticate to app (register + login)
        run: |
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"test@email.com","password":"testtest","passwordRepeat":"testtest"}' \
            > /dev/null || true
          TOKEN=$(curl -s -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@email.com","password":"testtest"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('authentication',{}).get('token',''))" 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            echo "Authenticated: got JWT (${#TOKEN} chars)."
          else
            echo "WARNING: no token - scan will run unauthenticated."
          fi
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Authenticated scan: ZAP injects "Authorization: Bearer <token>" on every
      # request via the replacer add-on, so it can reach logged-in pages.
      - name: OWASP ZAP authenticated baseline scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          # Build the replacer option as ONE single-line string (line breaks here
          # would be split into separate args and ZAP would misread them).
          ZAP_OPTS="replacer.full_list(0).description=auth replacer.full_list(0).enabled=true replacer.full_list(0).matchtype=REQ_HEADER replacer.full_list(0).matchstr=Authorization replacer.full_list(0).regex=false replacer.full_list(0).replacement=Bearer ${ZAP_TOKEN}"
          docker run --rm --network host \
            -v ${{ github.workspace }}/zap-out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -I \
            -r zap-report.html -w zap-report.md -J zap-report.json \
            -z "$ZAP_OPTS" || true

      - name: Upload ZAP report (download from run Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-out/

      - name: Stop target app
        if: always()
        run: docker rm -f juice-shop || true
