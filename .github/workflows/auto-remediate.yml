# .github/workflows/auto-remediate.yml
#
# DevSecOps PoC - automatic remediation of vulnerable DEPENDENCIES.
# Runs on GitHub's free cloud Linux runners (ubuntu-latest).
#
#   1. `npm audit fix` bumps vulnerable packages to safe versions.
#   2. If anything changed, open a Pull Request with the fix.
#   3. (PoC only) merge that PR automatically.
#
# !!! SAFETY WARNING !!!
# Auto-merge lands changes in `main` with NO human review. Fine for a throwaway
# PoC repo; NEVER do this on real code. Delete the final "Merge" step to keep a
# human in the loop. Auto-remediation only works for dependency (SCA) fixes.

name: Auto-Remediate Dependencies

on:
  schedule:
    - cron: '0 3 * * 1'      # every Monday 03:00 UTC
  workflow_dispatch:          # or run on demand from the Actions tab

permissions:
  contents: write            # to commit the fix
  pull-requests: write       # to open + merge the PR

jobs:
  auto-fix:
    name: Fix vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Attempt automatic dependency fixes
        id: fix
        run: |
          npm audit fix || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fixable dependency issues found."
          fi

      - name: Create Pull Request with the fix
        if: steps.fix.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(security): auto-remediate vulnerable dependencies"
          branch: auto/dependency-fixes
          delete-branch: true
          title: "Automated dependency security fixes"
          body: |
            Opened automatically by the DevSecOps PoC pipeline.
            Bumps vulnerable dependencies found by `npm audit`.
            Review the diff before relying on it in a real project.
          labels: security, automated

      # PoC-only: merge immediately. Delete this step to require human review.
      - name: Merge the PR (PoC only)
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
