# .github/workflows/auto-remediate.yml
#
# DevSecOps PoC - automatic remediation of vulnerable DEPENDENCIES.
#
# What it does:
#   1. Runs `npm audit fix` to bump vulnerable packages to safe versions.
#   2. If anything changed, opens a Pull Request with the fix.
#   3. (PoC only) Enables auto-merge so the PR merges itself once checks pass.
#
# !!! SAFETY WARNING - READ THIS !!!
# Auto-merge means fixes land in `main` with NO human review. That is fine for
# a throwaway PoC repo, but NEVER enable this on a real/production repository.
# Auto-remediation only works reliably for SCA (dependency) fixes - SAST/DAST
# code-logic fixes still need a human. See the guide, Step 7.

name: Auto-Remediate Dependencies

on:
  schedule:
    - cron: '0 3 * * 1'      # every Monday 03:00 UTC
  workflow_dispatch:          # or run it on demand from the Actions tab

permissions:
  contents: write            # to commit the fix
  pull-requests: write       # to open + auto-merge the PR

# Force bash so the scripts run on a Windows self-hosted runner
# (requires Git for Windows, which provides bash).
defaults:
  run:
    shell: bash

jobs:
  auto-fix:
    name: Fix vulnerable dependencies
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Attempt automatic dependency fixes
        id: fix
        run: |
          npm audit fix || true          # never hard-fail the PoC
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fixable dependency issues found."
          fi

      - name: Create Pull Request with the fix
        if: steps.fix.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(security): auto-remediate vulnerable dependencies"
          branch: auto/dependency-fixes
          delete-branch: true
          title: "Automated dependency security fixes"
          body: |
            This PR was opened automatically by the DevSecOps PoC pipeline.
            It bumps vulnerable dependencies found by `npm audit`.

            Review the diff before relying on it in a real project.
          labels: security, automated

      # PoC-only: merge the PR without human review once checks pass.
      # Delete this whole step to keep a human in the loop (recommended).
      - name: Enable auto-merge (PoC only)
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
