# .github/workflows/zap-full-scan.yml
# THOROUGH authenticated DAST: OWASP ZAP full scan (spider + AJAX spider +
# ACTIVE attacks). Much slower and more aggressive than the baseline scan, so
# it runs on demand / weekly rather than on every push.
#
# Only run against apps you own. Report is uploaded as an artifact.

name: ZAP Full Scan (thorough DAST)

on:
  workflow_dispatch:
    inputs:
      spider_minutes:
        description: "Minutes to spider before active scan"
        required: false
        default: "5"
      max_minutes:
        description: "Overall time cap for the whole scan"
        required: false
        default: "60"
  schedule:
    - cron: '0 5 * * 1'      # Mondays 05:00 UTC

permissions:
  contents: read

jobs:
  zap-full:
    name: ZAP Full Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start target app (OWASP Juice Shop)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000 > /dev/null; then echo "App up."; break; fi
            sleep 3
          done

      - name: Authenticate to app (register + login)
        run: |
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"test@email.com","password":"testtest","passwordRepeat":"testtest"}' \
            > /dev/null || true
          TOKEN=$(curl -s -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@email.com","password":"testtest"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('authentication',{}).get('token',''))" 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then echo "Authenticated: got JWT (${#TOKEN} chars)."; else echo "WARNING: no token."; fi
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: OWASP ZAP FULL scan (active + AJAX spider, authenticated)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          {
            echo "replacer.full_list(0).description=auth"
            echo "replacer.full_list(0).enabled=true"
            echo "replacer.full_list(0).matchtype=REQ_HEADER"
            echo "replacer.full_list(0).matchstr=Authorization"
            echo "replacer.full_list(0).regex=false"
            echo "replacer.full_list(0).replacement=Bearer ${ZAP_TOKEN}"
          } > zap-out/zap.prop
          docker run --rm --network host \
            -v ${{ github.workspace }}/zap-out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://localhost:3000 -I \
            -j \
            -m "${{ github.event.inputs.spider_minutes || '5' }}" \
            -T "${{ github.event.inputs.max_minutes || '60' }}" \
            -r zap-report.html -w zap-report.md -J zap-report.json \
            -z "-configfile /zap/wrk/zap.prop" || true

      - name: Upload ZAP full-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan-report
          path: zap-out/

      - name: Stop target app
        if: always()
        run: docker rm -f juice-shop || true
